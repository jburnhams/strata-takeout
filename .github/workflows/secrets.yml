name: Secret scan

# Scans the whole git history and the working tree for credentials on every push and pull request, and weekly.
# Two scanners on purpose: betterleaks (fast, pinned and checksum-verified) and TruffleHog (deeper, can verify live credentials).
on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: betterleaks (full history, then working tree)
        run: |
          v=1.10.0
          curl -fsSL -o bl.tgz "https://github.com/betterleaks/betterleaks/releases/download/v${v}/betterleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "https://github.com/betterleaks/betterleaks/releases/download/v${v}/checksums.txt"
          grep " betterleaks_${v}_linux_x64.tar.gz\$" checksums.txt | sed "s| betterleaks_${v}_linux_x64.tar.gz\$| bl.tgz|" | sha256sum -c -
          tar -xzf bl.tgz betterleaks
          ./betterleaks git --no-banner -v .
          ./betterleaks dir --no-banner -v .
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
