name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install bsdtar (the extractor and its tests use it)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: uv sync --locked
      - name: Lockfile, lint, format and types (once, on the newest Python)
        if: matrix.python-version == '3.13'
        run: uv run --no-sync strata-check --fast
      - name: Tests with coverage (unit and integration: the extract script is exercised by the integration tests)
        run: uv run --no-sync pytest --cov --cov-report=term
